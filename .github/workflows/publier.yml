# Vérifie, construit et met en ligne le jeu sur GitHub Pages à chaque poussée sur main.
# Le jeu est un site statique : seul le contenu de dist/ est publié.
name: Publier le jeu

on:
  push:
    branches: [main]
  # Permet de relancer la mise en ligne à la main, depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; celle qui est en cours va toujours à son terme.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # La construction vérifie aussi les types.
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publier:
    name: Mise en ligne
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.mise-en-ligne.outputs.page_url }}
    steps:
      - id: mise-en-ligne
        uses: actions/deploy-pages@v5
